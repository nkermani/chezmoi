# 3-pane workspace: yazi | helix + shell
# yazi (30% left), helix (top-right 60% height), shell (bottom-right 40% height)

enabled_layouts splits:horizontal

# Window 1: yazi file manager (30% width, full height)
launch --type=window --location=split --width=30% --title=yazi yazi

# Window 2: helix editor (top right, 60% height)
launch --type=window --location=vsplit --height=60% --title=editor hx

# Window 3: shell (bottom right, 40% height)
launch --type=window --location=vsplit --title=shell $SHELL
