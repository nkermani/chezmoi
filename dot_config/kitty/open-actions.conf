# Open files with line/column info (e.g., file:///path/file.rs#42:5) in VS Code
protocol file
fragment_matches \d+(:\d+)?
action launch --type=os-window code --goto "${FILE_PATH}:${FRAGMENT}"

# Open regular files in VS Code
protocol file
action launch --type=os-window code -- "${FILE_PATH}"

# Open directories in VS Code
protocol file
mime inode/directory
action launch --type=os-window code -- "${FILE_PATH}"
